<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ec">
<meta name="description" content="Прогресс по дням октября 2026">
<link rel="manifest" href="./manifest.webmanifest">
<title>Октябрь — прогресс</title>
<style>
:root{color-scheme:light;--bg:#f5f4ec;--ink:#493b39;--line:#b9a7a0;--done:#6f8e78;--muted:#9a8982}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{max-width:1050px;margin:0 auto;padding:54px 0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:54px}
h1{font-size:clamp(27px,5vw,42px);font-weight:550;letter-spacing:-.045em;margin:0}
.counter{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress-shell{overflow-x:auto;overflow-y:hidden;padding:18px 2px 12px;scrollbar-width:thin;scrollbar-color:#c8bbb4 transparent}
.track{position:relative;display:grid;grid-template-columns:repeat(31,minmax(28px,1fr));align-items:start;min-width:930px}
.track:before{content:"";position:absolute;left:14px;right:14px;top:14px;height:3px;background:var(--line);border-radius:4px}
.day{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer;font:inherit;min-width:0}
.dot{width:29px;height:29px;border:3px solid var(--line);border-radius:50%;background:var(--bg);display:block;transition:background .15s,border-color .15s,transform .15s}
.day.done .dot{background:var(--done);border-color:var(--done)}
.day:focus-visible{outline:2px solid var(--done);outline-offset:5px;border-radius:8px}
.day:active .dot{transform:scale(.9)}
.number{font-size:13px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.day.done .number{font-weight:700;color:var(--done)}
.footer{margin-top:54px;display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px}
.reset{border:1px solid #d4cbc3;border-radius:999px;background:transparent;color:var(--muted);padding:9px 15px;font:inherit;cursor:pointer}
.reset:active{background:#ebe8df}
@media(max-width:600px){main{padding-top:38px}header{margin-bottom:35px}.footer{margin-top:38px;align-items:flex-start;flex-direction:column}.progress-shell{margin-right:-18px;padding-right:18px}}
</style>
</head>
<body>
<main>
<header><h1>Октябрь 2026</h1><div class="counter" id="counter">0 / 31</div></header>
<section class="progress-shell" aria-label="Прогресс по дням октября">
<div class="track" id="track"></div>
</section>
<footer class="footer"><span id="caption">Отмечай каждый пройденный день</span><button class="reset" id="reset" type="button">Сбросить отметки</button></footer>
</main>
<script>
(function(){
 const KEY='october-progress-2026';
 const track=document.getElementById('track');
 const counter=document.getElementById('counter');
 const caption=document.getElementById('caption');
 let completed=[];
 try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))completed=saved.filter(n=>Number.isInteger(n)&&n>=1&&n<=31)}catch(e){}
 function save(){localStorage.setItem(KEY,JSON.stringify(completed))}
 function render(){
  track.innerHTML='';
  for(let day=1;day<=31;day++){
   const button=document.createElement('button');
   button.type='button';
   button.className='day'+(completed.includes(day)?' done':'');
   button.setAttribute('aria-label','День '+day+(completed.includes(day)?', выполнен':', не отмечен'));
   button.setAttribute('aria-pressed',completed.includes(day)?'true':'false');
   const dot=document.createElement('span');dot.className='dot';
   const number=document.createElement('span');number.className='number';number.textContent=day;
   button.append(dot,number);
   button.addEventListener('click',function(){
    completed=completed.includes(day)?completed.filter(n=>n!==day):completed.concat(day).sort((a,b)=>a-b);
    save();render();
   });
   track.append(button);
  }
  const count=completed.length;
  counter.textContent=count+' / 31';
  caption.textContent='Пройдено '+Math.round(count/31*100)+'% месяца';
 }
 document.getElementById('reset').addEventListener('click',function(){
  if(!completed.length)return;
  if(confirm('Сбросить все отметки за октябрь?')){completed=[];save();render()}
 });
 render();
})();
</script>
<script>
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
