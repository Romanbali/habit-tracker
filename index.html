<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ec">
<meta name="description" content="Октябрь — прогресс по 31 дню">
<link rel="manifest" href="./manifest.webmanifest">
<title>Октябрь</title>
<style>
:root{color-scheme:light;--bg:#f5f4ec;--ink:#493b39;--line:#b9a7a0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100% - 36px,1280px);margin:0 auto;padding:52px 0}
h1{margin:0 0 48px;font-size:clamp(27px,4vw,40px);font-weight:500;letter-spacing:-.04em}
.scroller{width:100%;overflow-x:auto;overflow-y:hidden;padding:5px 0 14px;scrollbar-width:thin;scrollbar-color:#c9bbb4 transparent}
.progress{position:relative;display:grid;grid-template-columns:repeat(31,minmax(24px,1fr));min-width:980px;align-items:start}
.progress:before{content:"";position:absolute;left:12px;right:12px;top:12px;height:3px;background:var(--line)}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.circle{display:block;width:25px;height:25px;border:3px solid #9d8983;border-radius:50%;background:var(--bg)}
.number{font-size:14px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
@media(min-width:1100px){.progress{min-width:0}.circle{width:27px;height:27px}.progress:before{top:13px}}
</style>
</head>
<body>
<main>
<h1>Октябрь</h1>
<div class="scroller" aria-label="Прогресс за 31 день октября">
<div class="progress">
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">1</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">2</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">3</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">4</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">5</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">6</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">7</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">8</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">9</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">10</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">11</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">12</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">13</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">14</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">15</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">16</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">17</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">18</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">19</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">20</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">21</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">22</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">23</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">24</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">25</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">26</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">27</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">28</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">29</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">30</span></div>
<div class="day"><span class="circle" aria-hidden="true"></span><span class="number">31</span></div>
</div>
</div>
</main>
</body>
</html>
